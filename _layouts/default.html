<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máximo Sangiácomo</title>
    <link rel="icon" type="image/png" href="{{ site.favicon }}">
    <!-- Cargamos Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    
    <div class="max-w-5xl mx-auto px-4 py-16 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12 items-start">
            
            <!-- Columna Izquierda: Perfil Fijo -->
            <div class="col-span-1 flex flex-col items-center md:items-start text-center md:text-left sticky top-16">
                <h1 class="text-3xl font-bold text-slate-900 mb-6">Máximo Sangiácomo</h1>
                
                <!-- Asegúrate de poner el nombre exacto de tu imagen aquí -->
                <img src="{{ site.logo }}" alt="Máximo Sangiácomo" class="rounded-2xl shadow-lg mb-6 w-full max-w-[250px] object-cover hover:shadow-xl transition-shadow duration-300">
                
                <p class="text-slate-500 mb-6">Página personal</p>
                
                <div class="flex flex-col gap-3 w-full max-w-[250px]">
                    <a href="{{ site.url }}" target="_blank" class="w-full text-center px-4 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-900 transition-colors font-medium text-sm shadow-sm">
                        Descargar CV
                    </a>
                    <a href="https://github.com/msangia" target="_blank" class="w-full text-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium text-sm shadow-sm">
                        Perfil en GitHub
                    </a>
                </div>            </div>

            <!-- Columna Derecha: Contenido que viene del index.md -->
            <div class="col-span-2">
                {{ content }}
            </div>

        </div>
    </div>

</body>
</html>
